server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets in transit
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Angular SPA — unknown paths fall back to index.html so client-side
    # routing works on hard refresh and direct URL entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — proxied to the backend container (same-origin from browser;
    # no CORS headers needed). client_max_body_size covers the 20 MB upload
    # limit specified in AGENT.md §13 plus multipart overhead.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # SignalR WebSocket hubs — WebSocket upgrade headers are required; the
    # 86400s timeout keeps long-lived connections alive without reconnection.
    location /hubs/ {
        proxy_pass         http://backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Aggressively cache hashed static assets produced by Angular's build.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
