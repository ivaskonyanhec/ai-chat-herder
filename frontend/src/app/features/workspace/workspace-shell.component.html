<main class="workspace" data-testid="main-chat">
  <aside class="workspace__nav">
    <div>
      <p class="workspace__nav-label">Chat Herder</p>
      <h1 class="workspace__nav-title">Structured chat workspace.</h1>
    </div>

    <nav class="workspace__nav-list" aria-label="Primary">
      <a
        class="workspace__nav-item"
        routerLink="/app/rooms"
        routerLinkActive="workspace__nav-item--active"
        data-testid="go-to-rooms"
      >
        Rooms
      </a>
      <button type="button" class="workspace__nav-item workspace__nav-item--muted">Direct Messages</button>
      <button type="button" class="workspace__nav-item workspace__nav-item--muted">Contacts</button>
      <a
        class="workspace__nav-item"
        routerLink="/app/sessions"
        routerLinkActive="workspace__nav-item--active"
        data-testid="go-to-sessions"
      >
        Sessions
      </a>
    </nav>

    @if (logoutError()) {
      <p class="workspace__nav-error" role="alert">{{ logoutError() }}</p>
    }

    <button class="workspace__logout" type="button" (click)="logout()">Sign out</button>
  </aside>
  <section class="workspace__content">
    <router-outlet />
  </section>
</main>
